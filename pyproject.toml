[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "signal-detector"
version = "0.1.0"
description = "Noise vs. Signal detection for Program Managers and Product Managers"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "pydantic>=2.0",
    "typer>=0.12",
    "rich>=13.0",
    "python-dotenv>=1.0",
]

[project.scripts]
signal-detector = "signal_detector.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["signal_detector*"]
